<!DOCTYPE html>
<html>
<head>
  <title>Beacon of Unity Code</title>

  <style>
    :root{
      --sky:#0ea5e9;
      --cyan:#06b6d4;
      --navy:#071e30;
      --deep:#0c2d48;
      --light:#e0f2fe;
    }

    body{
      margin:0;
      font-family:Arial;
      background:linear-gradient(180deg, var(--navy), var(--deep));
      color:var(--light);
    }

    .topbar{
      padding:12px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(12,45,72,0.7);
      border-bottom:1px solid rgba(224,242,254,0.1);
    }

    .brand{
      font-weight:bold;
      color:var(--sky);
      letter-spacing:0.5px;
    }

    textarea{
      width:100%;
      height:65vh;
      background:#061625;
      color:var(--light);
      border:none;
      padding:14px;
      font-size:14px;
      outline:none;
    }

    button{
      margin:10px;
      padding:10px 14px;
      background:linear-gradient(90deg,var(--sky),var(--cyan));
      border:none;
      cursor:pointer;
      font-weight:bold;
      border-radius:6px;
      color:#001018;
    }

    .output{
      height:25vh;
      background:#000;
      padding:12px;
      font-family:monospace;
      border-top:1px solid rgba(224,242,254,0.1);
    }
  </style>
</head>

<body>

<div class="topbar">
  <div class="brand">Beacon of Unity Code</div>
  <div>Theme Matched IDE</div>
</div>

<textarea id="code">print("Hello Beacon of Unity")</textarea>

<button onclick="runCode()">Run</button>

<pre class="output" id="output">Output will appear here...</pre>

<script>
function runCode(){
  let code = document.getElementById("code").value;
  document.getElementById("output").innerText =
    "Running in UI mode (Step 2)\n\n" + code;
}
</script>

</body>
</html>
